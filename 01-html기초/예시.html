<!DOCTYPE html>
<!--
  ↑ 이 문서는 HTML5 문서다 라고 브라우저에게 알려주는 선언.
    없으면 브라우저가 옛날 모드(quirks mode)로 동작해서 CSS가 이상해짐. 무조건 첫 줄에.
-->
<html lang="ko">
  <!--
    html = 문서 전체를 감싸는 최상위 태그.
    lang="ko" = 이 문서는 한국어다. 스크린리더 발음, 번역 제안, 폰트 처리에 영향.
  -->

  <head>
    <!--
      head = 화면에 "안 보이는" 정보들. 문서의 설정값 모음.
    -->
    <meta charset="UTF-8" />
    <!-- 글자 인코딩. 이거 없으면 한글이 ????? 로 깨짐 -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 모바일에서 화면 폭에 맞춰 보이게. 없으면 폰에서 데스크탑처럼 축소돼서 나옴 -->

    <title>이재현의 프로필</title>
    <!-- 브라우저 탭에 뜨는 이름. 검색 결과 제목이기도 함 -->
  </head>

  <body>
    <!--
      body = 화면에 실제로 "보이는" 모든 것.
    -->

    <!-- ============ 1. 제목 태그 h1~h6 ============ -->
    <h1>이재현</h1>
    <!--
      h1은 페이지의 대표 제목. 한 페이지에 1개가 원칙.
      h1 > h2 > h3 ... 순서를 건너뛰지 않는게 좋다 (h1 다음에 h3 X)
      "글씨 크게 하려고" h1 쓰는 게 아니다. 크기는 CSS 담당, 태그는 '의미' 담당.
    -->

    <p>웹 개발을 배우는 중입니다.</p>
    <!-- p = paragraph(문단). 글 한 덩어리 -->

    <hr />
    <!--
      hr = 수평 구분선. 닫는 태그가 없는 '빈 태그'.
      빈 태그 종류: <br> <hr> <img> <input> <meta> <link>
    -->

    <!-- ============ 2. 이미지 ============ -->
    <img
      src="https://picsum.photos/id/1005/200/200"
      alt="이재현의 프로필 사진"
      width="200"
    />
    <!--
      src  = 이미지 주소 (필수)
      alt  = 이미지가 안 뜨거나 시각장애인이 들을 때 읽히는 대체 텍스트 (필수라고 생각해라)
      img도 닫는 태그 없음
    -->

    <!-- ============ 3. 목록 ============ -->
    <h2>할 줄 아는 것</h2>
    <ul>
      <!-- ul = unordered list, 순서 없는 목록 (• 점) -->
      <li>HTML</li>
      <!-- li = list item. ul/ol의 자식은 반드시 li -->
      <li>CSS 조금</li>
      <li>JavaScript 아주 조금</li>
    </ul>

    <h2>오늘의 목표</h2>
    <ol>
      <!-- ol = ordered list, 순서 있는 목록 (1. 2. 3.) -->
      <li>HTML 태그 익히기</li>
      <li>직접 페이지 만들어보기</li>
      <li>JS로 움직이게 하기</li>
    </ol>

    <!-- ============ 4. 링크 ============ -->
    <h2>링크</h2>
    <p>
      자세한 문서는
      <a href="https://developer.mozilla.org/ko/" target="_blank">MDN</a>
      에서 볼 수 있습니다.
    </p>
    <!--
      a = anchor(닻), 링크.
      href = 이동할 주소
      target="_blank" = 새 탭에서 열기
      a는 '인라인' 요소라서 글 중간에 자연스럽게 낀다.
    -->

    <!-- ============ 5. 블록 vs 인라인 ============ -->
    <h2>블록과 인라인</h2>
    <div>나는 div. 혼자 한 줄을 다 차지한다 (블록)</div>
    <div>나도 div. 그래서 위 아래로 쌓인다</div>
    <p>
      나는 p 안의 글인데
      <span>이 부분만 span</span>
      이라서 줄바꿈 없이 글 사이에 낀다 (인라인)
    </p>
    <!--
      div  = 의미 없는 '블록' 상자. 묶을 때 씀
      span = 의미 없는 '인라인' 상자. 글 일부만 집을 때 씀
      의미가 있는 상황이면 div 대신 header/nav/main/section/footer 를 쓴다 (나중에 배움)
    -->

    <!-- ============ 6. 버튼과 입력칸 (나중에 JS가 붙을 자리) ============ -->
    <h2>인사하기</h2>
    <input type="text" id="nameInput" placeholder="이름을 입력하세요" />
    <button id="greetBtn">인사</button>
    <p id="result">여기에 결과가 나옵니다</p>
    <!--
      id = 이 요소의 고유 이름표. 페이지 안에서 중복 금지.
           나중에 JS가 document.getElementById("greetBtn") 으로 이 버튼을 잡는다.
      placeholder = 입력칸에 흐리게 뜨는 안내문 (값이 아님!)
    -->

    <!-- 지금은 JS 없음. 버튼 눌러도 아무 일 안 일어남. 그건 07단계에서 붙인다. -->
  </body>
</html>
