  ─────────────  만들어야 할 화면 (브라우저에서 이렇게 보여야 함)  ─────────────

     내가 좋아하는 영화                      ← 페이지 대표 제목 (제일 큼)

     인생 영화 3편을 소개합니다.             ← 문단

     ────────────────────────────           ← 구분선

     [  포스터 이미지 300px  ]               ← 이미지, 대체텍스트 있어야 함

     좋아하는 이유                           ← 중간 제목
      • 음악이 좋다                          ← 점 목록 3개
      • 배우가 좋다
      • 결말이 좋다

     추천 순위                               ← 중간 제목
      1. 인터스텔라                          ← 번호 목록 3개
      2. 라라랜드
      3. 인셉션

     더 보기                                 ← 중간 제목
     자세한 정보는 IMDb 에서 확인하세요.       ← 문단 안에 '링크'가 들어가야 함
                    ↑ 여기가 클릭되는 링크, 새 탭으로 열리게

     한줄평 남기기                            ← 중간 제목
     [ 입력칸: "한줄평을 적어주세요" ]  [ 등록 ]   ← input + button
     아직 한줄평이 없습니다.                    ← 문단

  ───────────────────────────  요구사항 체크리스트  ───────────────────────────
  [ ] DOCTYPE, html(lang="ko"), head, body 구조 갖추기
  [ ] head 안에 charset, viewport, title 넣기 (title은 "내가 좋아하는 영화")
  [ ] h1 은 딱 1개, 중간 제목들은 h2
  [ ] img 에 src, alt, width="300" 넣기
      → 이미지 주소는 https://picsum.photos/id/1025/300/300 써도 됨
  [ ] ul + li 3개, ol + li 3개
  [ ] p 태그 안쪽에 a 태그를 넣기 (문장 중간에 링크가 끼어야 함)
      → 링크 주소는 https://www.imdb.com , target="_blank"
  [ ] input 에 type, id="reviewInput", placeholder 넣기
  [ ] button 에 id="submitBtn"
  [ ] 마지막 p 에 id="reviewList"
      (id 3개는 다음 시간에 JS로 잡을 손잡이다. 이름 정확히 맞춰라)

  ────────────────────────────  힌트 (막힐 때만)  ────────────────────────────
  · 태그는 <여는태그> 내용 </닫는태그> 가 기본
  · img, input, meta, hr, br 은 닫는 태그가 없다
  · 속성은 여는 태그 안에만 → <a href="주소">글자</a>
  · 들여쓰기: 자식 태그는 부모보다 2칸 안으로. 안 지키면 나중에 지옥 봄

  다 짰으면 저장하고 브라우저로 열어서 확인 → 나한테 "1단계 다 했어" 라고 말할 것.
