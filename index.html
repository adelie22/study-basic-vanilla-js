<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내가좋아하는영화</title>
    <style>

      * {
        box-sizing: border-box;
      }

      body {
        background-color: rgb(255, 255, 255);
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }

      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h1 {
        color: blueviolet;
        margin: 0;
      }
      .card-head p {
        margin: 0;
      }

      img {
        border-radius: 8px;
      }

     
      .del {
        background: none;
        border: none;
        cursor: pointer;
        color: #a1a1aa;
        font-size: 18px;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 6px;
      }

      .del:hover {
        background: #fee2e2;
        color: #dc2626;
      }

      .btn {
        background-color: blueviolet;
        color: aliceblue;
        cursor: pointer;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
      }

      .btn:hover {
        background-color: rgb(255, 255, 255);
        color: black;
      }

      .form-row {
        display: flex;
        gap: 8px;
      }

      .input {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #000000;
      }

      #reviewList:empty::before {
        content: "아직 한줄평이 없습니다.";
        color: #a1a1aa;
        font-size: 14px;

        list-style: none;
        padding-left: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      #reviewList {
        padding-left: 0;
      }

      #reviewList li {
        background-color: #eef2ff;
        color: #4f46e5;
        padding: 6px 14px;
        border-radius: 999px;
        list-style: none;
        margin-bottom: 5px;
      }

      .reviewList li strong {
        display: block;
      }

      .reviewList li small {
        color: #71717a;
      }

      .movieGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }

      .card {
        border: none; overflow: hidden;
        display: flex; flex-direction: column;
        border: 1px solid #e4e4e7;
        border-radius: 15px;
      }

      .card img {
         width: 100%; aspect-ratio: 2 / 3; 
         object-fit: cover; display: block;
         border-radius: 0;
      }

      .card-body {
        padding: 12px; flex: 1;
      }
    .card h3 { font-size: 15px; margin: 0 0 2px; }
      .card p { font-size: 13px; color: #71717a; margin: 0; }



    </style>
  </head>
  <body>
   
      <div class="card-head">
        <h1>내가 좋아하는 영화</h1>
        <p>인생 영화 3편을 소개합니다.</p>
      </div>
      <hr />

      <div id="movieGrid" class="movieGrid">
    
      </div>


      <h2>한줄평 남기기</h2>
      <div class="form-row">
        <input
          type="text"
          id="reviewInput"
          placeholder="한줄평을 적어주세요"
          class="input"
        />
        <button id="submitBtn" class="btn">등록</button>
        <button id="loadBtn" class="btn">한줄평 불러오기</button>
      </div>
      <ul id="reviewList"></ul>
      <span class="reviewStatus">한줄평이 없습니다.</span>
      <p id="countText"></p>
    

    <script>
    const movies = [
  { id: 1, title: "인터스텔라", year: 2014, genre: "SF", poster: "https://picsum.photos/id/1025/300/450" },
  { id: 2, title: "라라랜드", year: 2016, genre: "뮤지컬", poster: "https://picsum.photos/id/1015/300/450" },
  { id: 3, title: "인셉션", year: 2010, genre: "SF", poster: "https://picsum.photos/id/1016/300/450" },
  { id: 4, title: "기생충", year: 2019, genre: "드라마", poster: "https://picsum.photos/id/1024/300/450" },
  { id: 5, title: "위플래쉬", year: 2014, genre: "드라마", poster: "https://picsum.photos/id/1035/300/450" },
  { id: 6, title: "매드맥스", year: 2015, genre: "액션", poster: "https://picsum.photos/id/1043/300/450" },
];
      const KEY = "comments";
      const reviewInput = document.getElementById("reviewInput");
      const submitBtn = document.getElementById("submitBtn");
      const reviewList = document.getElementById("reviewList");
      const countText = document.getElementById("countText");
      const loadBtn = document.getElementById("loadBtn");
      const reviewStatus = document.querySelector(".reviewStatus");
      const movieGrid = document.querySelector(".movieGrid");

      let comments = JSON.parse(localStorage.getItem(KEY)) || [];



      function renderMovies() {
        movieGrid.innerHTML = "";

        movies.forEach((movie) => {
            const card = document.createElement("article");
            card.className = "card";

            const img = document.createElement("img");
            img.src = movie.poster;
            img.alt = `${movie.title} 의 포스터`;
            img.loading = "lazy";

            const body = document.createElement("div");
            body.className = "card-body";
            
            const movieName = document.createElement("h3");
            movieName.textContent = movie.title;

            const info = document.createElement("p");
            info.textContent = `${movie.year} · ${movie.genre}`;

            body.appendChild(movieName);
            body.appendChild(info);
            card.appendChild(img);
            card.appendChild(body);
            movieGrid.appendChild(card);
        });
      }

      renderMovies();

      async function loadComment() {
        loadBtn.disabled = true;
        reviewStatus.textContent = "불러오는중...";

        try {
          const res = await fetch("https://jsonplaceholder.typicode.com/users");
          if (!res.ok) {
            throw new Error(`서버 오류: ${res.status}`);
          }
          const reviews = await res.json();

          reviews.forEach((review) => {
            comments.push({ id: Date.now() + review.id, text: review.name });
          });
          save();
          render();

          reviewStatus.textContent = "";
        } catch (err) {
          reviewStatus.textContent = `실패: ${err.message}`;
          console.error(err);
        } finally {
          loadBtn.disabled = false;
        }
      }

      loadBtn.addEventListener("click", loadComment);

      function save() {
        localStorage.setItem(KEY, JSON.stringify(comments));
      }

      function render() {
        reviewList.innerHTML = "";

        comments.forEach((comment) => {
          const li = document.createElement("li");
          const span = document.createElement("span");
          span.textContent = comment.text;

          const delBtn = document.createElement("button");
          delBtn.className = "del";
          delBtn.textContent = "삭제";
          delBtn.dataset.id = comment.id;

          li.appendChild(span);
          li.appendChild(delBtn);
          reviewList.appendChild(li);
        });
        countText.textContent = `총 ${comments.length}개`;
      }

      submitBtn.addEventListener("click", function () {
        const text = reviewInput.value.trim();
        if (text === "") return;
        comments.push({ id: Date.now(), text: text });
        save();
        render();

        reviewInput.value = "";
        reviewInput.focus();
      });

      reviewInput.addEventListener("keydown", function (e) {
        if (e.isComposing) return;
        if (e.key === "Enter") {
          submitBtn.click();
        }
      });

      reviewList.addEventListener("click", function (e) {
        if (!e.target.classList.contains("del")) return;
        const id = Number(e.target.dataset.id);
        comments = comments.filter((comment) => comment.id !== id);
        save();
        render();
      });

      render();
    </script>
  </body>
</html>
