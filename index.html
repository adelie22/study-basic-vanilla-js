<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내가좋아하는영화</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background-color: rgb(205, 211, 211);
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }
      .card {
        background-color: white;
        border: 1px solid #000000;
        border-radius: 5px;
        padding: 24px;
        max-width: 500px;
        margin: 20px auto;
      }

      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h1 {
        color: blueviolet;
        margin: 0;
      }
      .card-head p {
        margin: 0;
      }

      img {
        border-radius: 8px;
      }

      .reason-list {
        list-style: none;
        padding-left: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .reason-list li {
        background-color: #eef2ff; /* ← 이걸 넣으면 그 순간 알약이 나타납니다 */
        color: #4f46e5;
        padding: 6px 14px;
        border-radius: 999px;
      }
      .del {
        background: none;
        border: none;
        cursor: pointer;
        color: #a1a1aa;
        font-size: 18px;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 6px;
      }

      .del:hover {
        background: #fee2e2;
        color: #dc2626;
      }

      .btn {
        background-color: blueviolet;
        color: aliceblue;
        cursor: pointer;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
      }
      .btn:hover {
        background-color: rgb(255, 255, 255);
        color: black;
      }
      .form-row {
        display: flex;
        gap: 8px;
      }
      .input {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #000000;
      }

      #reviewList:empty::before {
        content: "아직 한줄평이 없습니다.";
        color: #a1a1aa;
        font-size: 14px;

        list-style: none;
        padding-left: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      #reviewList {
        padding-left: 0;
      }
      #reviewList li {
        background-color: #eef2ff;
        color: #4f46e5;
        padding: 6px 14px;
        border-radius: 999px;
        list-style: none;
        margin-bottom: 5px;
      }

      .reviewList li strong {
        display: block;
      }
      .reviewList li small {
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-head">
        <h1>내가 좋아하는 영화</h1>
        <p>인생 영화 3편을 소개합니다.</p>
      </div>
      <hr />

      <img
        src="https://picsum.photos/id/1025/300/300"
        width="300"
        alt="인터스텔라 포스터"
      />

      <h2>좋아하는 이유</h2>
      <ul class="reason-list">
        <li>음악이 좋다</li>
        <li>배우가 좋다</li>
        <li>결말이 좋다</li>
      </ul>

      <h2>추천 순위</h2>
      <ol>
        <li>인터스텔라</li>
        <li>라라랜드</li>
        <li>인셉션</li>
      </ol>

      <h2>더 보기</h2>
      <p>
        자세한 정보는
        <a href="https://www.imdb.com" target="_blank">IMDb</a>에서 확인하세요
      </p>

      <h2>한줄평 남기기</h2>
      <div class="form-row">
        <input
          type="text"
          id="reviewInput"
          placeholder="한줄평을 적어주세요"
          class="input"
        />
        <button id="submitBtn" class="btn">등록</button>
        <button id="loadBtn" class="btn">한줄평 불러오기</button>
      </div>
      <ul id="reviewList"></ul>
      <span class="reviewStatus">한줄평이 없습니다.</span>
      <p id="countText"></p>
    </div>

    <script>
      const KEY = "comments";
      const reviewInput = document.getElementById("reviewInput");
      const submitBtn = document.getElementById("submitBtn");
      const reviewList = document.getElementById("reviewList");
      const countText = document.getElementById("countText");
      const loadBtn = document.getElementById("loadBtn");
      const reviewStatus = document.querySelector(".reviewStatus");
      let comments = JSON.parse(localStorage.getItem(KEY)) || [];

      async function loadComment() {
        loadBtn.disabled = true;
        reviewStatus.textContent = "불러오는중...";

        try {
          const res = await fetch("https://jsonplaceholder.typicode.com/users");
          if (!res.ok) {
            throw new Error(`서버 오류: ${res.status}`);
          }
          const reviews = await res.json();

          reviews.forEach((review) => {
            comments.push({ id: Date.now() + review.id, text: review.name });
          });
          save();
          render();

          reviewStatus.textContent = "";
        } catch (err) {
          reviewStatus.textContent = `실패: ${err.message}`;
          console.error(err);
        } finally {
          loadBtn.disabled = false;
        }
      }

      loadBtn.addEventListener("click", loadComment);

      function save() {
        localStorage.setItem(KEY, JSON.stringify(comments));
      }

      function render() {
        reviewList.innerHTML = "";

        comments.forEach((comment) => {
          const li = document.createElement("li");
          const span = document.createElement("span");
          span.textContent = comment.text;

          const delBtn = document.createElement("button");
          delBtn.className = "del";
          delBtn.textContent = "삭제";
          delBtn.dataset.id = comment.id;

          li.appendChild(span);
          li.appendChild(delBtn);
          reviewList.appendChild(li);
        });
        countText.textContent = `총 ${comments.length}개`;
      }

      submitBtn.addEventListener("click", function () {
        const text = reviewInput.value.trim();
        if (text === "") return;
        comments.push({ id: Date.now(), text: text });
        save();
        render();

        reviewInput.value = "";
        reviewInput.focus();
      });

      reviewInput.addEventListener("keydown", function (e) {
        if (e.isComposing) return;
        if (e.key === "Enter") {
          submitBtn.click();
        }
      });

      reviewList.addEventListener("click", function (e) {
        if (!e.target.classList.contains("del")) return;
        const id = Number(e.target.dataset.id);
        comments = comments.filter((comment) => comment.id !== id);
        save();
        render();
      });

      render();
    </script>
  </body>
</html>
