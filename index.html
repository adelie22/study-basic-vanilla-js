<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내가좋아하는영화</title>
    <style>
      :root {
        /* 브랜드 */
        --primary: #4f46e5;
        --primary-dark: #4338ca;
        --primary-light: #eef2ff;

        /* 글자 */
        --text: #27272a;
        --text-muted: #71717a;
        --text-faint: #a1a1aa;
        --heading: rgb(127, 16, 53);

        /* 배경·테두리 */
        --bg: #ffffff;
        --border: #e4e4e7;

        /* 경고 */
        --danger: #dc2626;
        --danger-light: #fee2e2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        line-height: 1.6;
        max-width: 1000px;
        margin: 0 auto;
        padding: 16px;
      }

      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h1 {
        color: var(--heading);
        margin: 0;
      }
      .card-head p {
        margin: 0;
      }

      .del {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-faint);
        font-size: 18px;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 6px;
      }

      .del:hover {
        background: var(--danger-light);
        color: var(--danger);
      }

      .btn {
        background-color: var(--primary);
        color: #fff;
        cursor: pointer;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
      }

      .btn:hover {
        background-color: var(--primary-dark);
      }

      .form-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .input {
        flex: 1;
        padding: 10px;
        border-radius: 15px;
        border: 1px solid var(--border);
        font-family: inherit;
      }
      .input:focus {
        outline: none;
        border-color: var(--primary);
      }

      .reviewList:empty::before {
        content: "아직 한줄평이 없습니다.";
        color: var(--text-faint);
      }

      .reviewList {
        padding-left: 0;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .reviewList li {
        background-color: var(--primary-light);
        color: var(--primary);
        padding: 6px 14px;
        border-radius: 999px;
        list-style: none;
        margin-bottom: 5px;
      }

      .movieGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }

      .search-container {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }

      .search,
      select {
        border-radius: 15px;
        border: 1px solid var(--border);
        font-family: inherit;
        font-size: 15px;
        margin-bottom: 8px;
        height: 30px;
        padding: 5px;
      }

      .search {
        flex: 1;
      }
      .search:focus {
        outline: none;
        border-color: var(--primary);
      }

      .card {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: 15px;
      }

      .card img {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        display: block;
      }

      .card-body {
        padding: 12px;
        flex: 1;
      }
      .card h3 {
        font-size: 15px;
        margin: 0 0 2px;
      }
      .card p {
        font-size: 13px;
        color: var(--text-muted);
        margin: 0;
      }

      .empty {
        grid-column: 1 / -1; /* 격자 전체 폭을 차지 */
        text-align: center;
        color: var(--text-faint);
        padding: 20px 0;
      }
    </style>
  </head>
  <body>
    <div class="card-head">
      <h1>Moive List</h1>
      <p>인생 영화 3편을 소개합니다.</p>
    </div>
    <hr />
    <div class="search-container">
      <input class="search" type="search" placeholder="영화를 검색하세요" />
      <select id="genreSelect">
        <option value="">모든 장르</option>
      </select>
      <select id="sortSelect">
        <option value="default">기본순</option>
        <option value="year-desc">최신순</option>
        <option value="year-asc">오래된순</option>
        <option value="title">제목순</option>
      </select>
    </div>
    <span class="count"></span>

    <div id="movieGrid" class="movieGrid"></div>

    <h2>한줄평 남기기</h2>
    <div class="form-row">
      <input
        type="text"
        id="reviewInput"
        placeholder="한줄평을 적어주세요"
        class="input"
      />
      <button id="submitBtn" class="btn">등록</button>
      <button id="loadBtn" class="btn">한줄평 불러오기</button>
    </div>
    <ul id="reviewList" class="reviewList"></ul>
    <span class="reviewStatus">한줄평이 없습니다.</span>
    <p id="countText"></p>

    <script>
      // 배열
      const movies = [
        {
          id: 1,
          title: "인터스텔라",
          year: 2014,
          genre: "SF",
          poster: "https://picsum.photos/id/1025/300/450",
        },
        {
          id: 2,
          title: "라라랜드",
          year: 2016,
          genre: "뮤지컬",
          poster: "https://picsum.photos/id/1015/300/450",
        },
        {
          id: 3,
          title: "인셉션",
          year: 2010,
          genre: "SF",
          poster: "https://picsum.photos/id/1016/300/450",
        },
        {
          id: 4,
          title: "기생충",
          year: 2019,
          genre: "드라마",
          poster: "https://picsum.photos/id/1024/300/450",
        },
        {
          id: 5,
          title: "위플래쉬",
          year: 2014,
          genre: "드라마",
          poster: "https://picsum.photos/id/1035/300/450",
        },
        {
          id: 6,
          title: "매드맥스",
          year: 2015,
          genre: "액션",
          poster: "https://picsum.photos/id/1043/300/450",
        },
      ];

      // 상수, 변수
      const KEY = "comments";

      // 상태
      let genre = "";
      let sort = "default";
      let comments = JSON.parse(localStorage.getItem(KEY)) || [];
      let keyword = "";

      //   DOM 참조
      const reviewInput = document.getElementById("reviewInput");
      const submitBtn = document.getElementById("submitBtn");
      const reviewList = document.getElementById("reviewList");
      const countText = document.getElementById("countText");
      const loadBtn = document.getElementById("loadBtn");
      const reviewStatus = document.querySelector(".reviewStatus");
      const movieGrid = document.querySelector(".movieGrid");
      const search = document.querySelector(".search");
      const count = document.querySelector(".count");
      const genreSelect = document.getElementById("genreSelect");
      const sortSelect = document.getElementById("sortSelect");

      // 순수 함수
      // 영화배열에 있는 영화들의 모든 장르를 중복없이 부모노드에 붙여주는 함수
      function fillGenres() {
        const genres = [...new Set(movies.map((m) => m.genre))];
        genres.forEach((g) => {
          const opt = document.createElement("option");
          opt.value = g;
          opt.textContent = g;
          genreSelect.appendChild(opt);
        });
      }

      // 검색, 정렬에 맞는 영화를 list에 담아주는 함수
      function getVisibleMovies() {
        let list = movies.filter((movie) => {
          const matchKeyword = movie.title
            .toLowerCase()
            .includes(keyword.toLowerCase());
          const matchGenre = genre === "" || movie.genre === genre;
          return matchKeyword && matchGenre;
        });

        if (sort === "year-desc") {
          list.sort((a, b) => b.year - a.year);
        } else if (sort === "year-asc") {
          list.sort((a, b) => a.year - b.year);
        } else if (sort === "title") {
          list.sort((a, b) => a.title.localeCompare(b.title));
        }
        return list;
      }

      // list를 보고 렌더링하는 함수
      function renderMovies() {
        const list = getVisibleMovies();
        movieGrid.innerHTML = "";

        if (list.length === 0) {
          const p = document.createElement("p");
          p.className = "empty";
          p.textContent = `"${keyword}" 검색 결과가 없습니다`;
          movieGrid.appendChild(p);
          return;
        }

        list.forEach((movie) => {
          const card = document.createElement("article");
          card.className = "card";

          const img = document.createElement("img");
          img.src = movie.poster;
          img.alt = `${movie.title} 포스터`;
          img.loading = "lazy";

          const body = document.createElement("div");
          body.className = "card-body";

          const h3 = document.createElement("h3");
          h3.textContent = movie.title;

          const info = document.createElement("p");
          info.textContent = `${movie.year} · ${movie.genre}`;

          body.appendChild(h3);
          body.appendChild(info);
          card.appendChild(img);
          card.appendChild(body);
          movieGrid.appendChild(card);
        });

        count.textContent = `${list.length}편`;
      }

      // 한줄평 로컬저장소에서 불러오는 함수
      async function loadReview() {
        loadBtn.disabled = true;
        reviewStatus.textContent = "불러오는중...";

        try {
          const res = await fetch("https://jsonplaceholder.typicode.com/users");
          if (!res.ok) {
            throw new Error(`서버 오류: ${res.status}`);
          }
          const reviews = await res.json();

          reviews.forEach((review) => {
            comments.push({ id: Date.now() + review.id, text: review.name });
          });
          saveReview();
          renderReview();

          reviewStatus.textContent = "";
        } catch (err) {
          reviewStatus.textContent = `실패: ${err.message}`;
          console.error(err);
        } finally {
          loadBtn.disabled = false;
        }
      }

      // 로컬저장소에 한줄평 저장하는 함수
      function saveReview() {
        localStorage.setItem(KEY, JSON.stringify(comments));
      }

      //한줄평 렌더링하는 함수
      function renderReview() {
        reviewList.innerHTML = "";

        comments.forEach((comment) => {
          const li = document.createElement("li");
          const span = document.createElement("span");
          span.textContent = comment.text;

          const delBtn = document.createElement("button");
          delBtn.className = "del";
          delBtn.textContent = "삭제";
          delBtn.dataset.id = comment.id;

          li.appendChild(span);
          li.appendChild(delBtn);
          reviewList.appendChild(li);
        });
        countText.textContent = `총 ${comments.length}개`;
      }

      // 이벤트 리스너
      search.addEventListener("input", function (e) {
        keyword = search.value.trim();
        renderMovies();
      });
      renderMovies();

      genreSelect.addEventListener("change", function () {
        genre = genreSelect.value;
        renderMovies();
      });

      sortSelect.addEventListener("change", function () {
        sort = sortSelect.value;
        renderMovies();
      });

      loadBtn.addEventListener("click", loadReview);

      submitBtn.addEventListener("click", function () {
        const text = reviewInput.value.trim();
        if (text === "") return;
        comments.push({ id: Date.now(), text: text });
        saveReview();
        renderReview();

        reviewInput.value = "";
        reviewInput.focus();
      });

      reviewInput.addEventListener("keydown", function (e) {
        if (e.isComposing) return;
        if (e.key === "Enter") {
          submitBtn.click();
        }
      });

      reviewList.addEventListener("click", function (e) {
        if (!e.target.classList.contains("del")) return;
        const id = Number(e.target.dataset.id);
        comments = comments.filter((comment) => comment.id !== id);
        saveReview();
        renderReview();
      });
      

      fillGenres();
      renderReview();
    </script>
  </body>
</html>
