<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS 입문 - DOM 조작과 이벤트</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        background: #f4f4f5;
        color: #27272a;
        line-height: 1.6;
        padding: 24px;
        max-width: 560px;
        margin: 0 auto;
      }
      .demo {
        background: #fff;
        border: 1px solid #e4e4e7;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 24px;
      }
      h2 { margin-top: 0; font-size: 18px; }
      .btn {
        background: #4f46e5; color: #fff; border: none;
        padding: 9px 18px; border-radius: 8px; cursor: pointer;
        font-size: 15px; font-family: inherit;
      }
      .btn:hover { background: #4338ca; }
      .input {
        padding: 9px 12px; border: 1px solid #d4d4d8;
        border-radius: 8px; font-family: inherit; font-size: 15px;
      }
      .row { display: flex; gap: 8px; }
      .row .input { flex: 1; }
      .out {
        margin: 12px 0 0; padding: 10px 12px;
        background: #fafafa; border-radius: 8px; min-height: 42px;
      }
      .highlight { background: #fef9c3; }
      ul { padding-left: 20px; }
    </style>
  </head>

  <body>
    <h1>JS 입문</h1>

    <!-- ========== 1 ========== -->
    <div class="demo">
      <h2>1. 버튼 누르면 글자 바꾸기</h2>
      <button class="btn" id="helloBtn">인사하기</button>
      <p class="out" id="helloOut">여기가 바뀝니다</p>
    </div>

    <!-- ========== 2 ========== -->
    <div class="demo">
      <h2>2. 입력칸 값 읽어오기</h2>
      <div class="row">
        <input class="input" id="nameInput" type="text" placeholder="이름" />
        <button class="btn" id="nameBtn">확인</button>
      </div>
      <p class="out" id="nameOut">아직 입력 없음</p>
    </div>

    <!-- ========== 3 ========== -->
    <div class="demo">
      <h2>3. 숫자 세기 (변수에 상태 저장)</h2>
      <div class="row">
        <button class="btn" id="minusBtn">-1</button>
        <button class="btn" id="plusBtn">+1</button>
        <button class="btn" id="resetBtn">리셋</button>
      </div>
      <p class="out" id="countOut">0</p>
    </div>

    <!-- ========== 4 ========== -->
    <div class="demo">
      <h2>4. 실시간 반응 (input 이벤트)</h2>
      <input class="input" id="liveInput" type="text" placeholder="쳐보세요" />
      <p class="out" id="liveOut">여기에 실시간으로 나옵니다</p>
    </div>

    <!-- ========== 5 ========== -->
    <div class="demo">
      <h2>5. 목록에 항목 추가 (요소 만들기)</h2>
      <div class="row">
        <input class="input" id="todoInput" type="text" placeholder="할 일" />
        <button class="btn" id="todoBtn">추가</button>
      </div>
      <ul id="todoList"></ul>
    </div>

    <!-- ========== 6 ========== -->
    <div class="demo">
      <h2>6. 클래스 켜고 끄기 (스타일은 CSS가, 스위치만 JS가)</h2>
      <button class="btn" id="toggleBtn">형광펜 토글</button>
      <p class="out" id="toggleOut">이 문장에 형광펜이 켜졌다 꺼집니다</p>
    </div>

    <!--
      ★ script 태그는 </body> 바로 앞에 둔다.
        HTML은 위에서 아래로 읽힌다. script가 head에 있으면
        아직 만들어지지 않은 요소를 찾으려 해서 null 이 나온다.
        "HTML 다 그린 다음에 JS 실행" 이 순서를 기억하라.
    -->
    <script>
      /* ==========================================================
         0. 콘솔 — JS의 눈
         ==========================================================
         브라우저에서 F12 (맥: Cmd+Option+I) → Console 탭.
         console.log() 로 값을 찍어보는 게 디버깅의 90%다.
         "왜 안 되지?" 싶으면 무조건 찍어봐라.
      */
      console.log("JS 파일이 실행됐습니다");

      /* ==========================================================
         1. 변수 — 값에 이름 붙이기
         ==========================================================
            const  = 다시 대입 못 함 (기본값. 웬만하면 이거)
            let    = 다시 대입 가능 (값이 변해야 할 때만)
            var    = 옛날 것. 쓰지 마라.

         "일단 const로 쓰고, 에러 나면 let으로 바꾼다" 가 실무 습관.
      */

      /* ==========================================================
         2. 요소 잡기 (DOM 선택)
         ==========================================================
            document.getElementById("아이디")     ← id로 하나
            document.querySelector("CSS선택자")   ← CSS 문법 그대로. 첫 번째 하나
            document.querySelectorAll("CSS선택자") ← 해당하는 것 전부

         querySelector 는 CSS 선택자를 그대로 쓴다:
            querySelector("#helloBtn")   id
            querySelector(".btn")        class
            querySelector("ul li")       후손
      */

      // ---------- 1. 버튼 누르면 글자 바꾸기 ----------
      const helloBtn = document.getElementById("helloBtn");
      const helloOut = document.getElementById("helloOut");

      helloBtn.addEventListener("click", function () {
        helloOut.textContent = "안녕하세요!";
      });
      /*
         addEventListener(이벤트이름, 실행할함수)
           = "이 요소에서 click 이 일어나면 이 함수를 실행해줘"

         함수를 바로 실행하는 게 아니라 '넘겨주는' 것이다.
         브라우저가 나중에 클릭이 일어났을 때 대신 실행해준다.
         이렇게 넘기는 함수를 콜백(callback) 이라고 부른다.

         textContent = 그 요소 안의 '글자'
           읽기: const t = helloOut.textContent;
           쓰기: helloOut.textContent = "새 글자";
      */

      // ---------- 2. 입력칸 값 읽기 ----------
      const nameInput = document.getElementById("nameInput");
      const nameBtn = document.getElementById("nameBtn");
      const nameOut = document.getElementById("nameOut");

      nameBtn.addEventListener("click", function () {
        const name = nameInput.value; // ★ input 은 textContent 가 아니라 .value
        nameOut.textContent = name + "님 반갑습니다";
        //                    ↑ + 로 문자열을 이어붙일 수 있다

        // 더 좋은 방법: 백틱(`) 템플릿 리터럴
        nameOut.textContent = `${name}님 반갑습니다`;
        // ` ` 안에서 ${변수} 로 값을 끼워넣는다. 훨씬 읽기 쉽다.
      });
      /*
         ★ 헷갈리기 쉬운 것
            <p>, <div>, <button> → .textContent   (태그 사이의 글자)
            <input>, <textarea>  → .value         (사용자가 입력한 값)
         input 에 textContent 쓰면 undefined 나온다.
      */

      // ---------- 3. 카운터 — 상태를 변수에 저장 ----------
      let count = 0; // 값이 변하니까 let
      const countOut = document.getElementById("countOut");

      // 화면 갱신을 함수로 묶어둔다 (같은 코드 3번 쓰기 싫으니까)
      function render() {
        countOut.textContent = count;
      }

      document.getElementById("plusBtn").addEventListener("click", function () {
        count = count + 1; // count += 1  또는  count++ 와 같다
        render();
      });

      document.getElementById("minusBtn").addEventListener("click", function () {
        count -= 1;
        render();
      });

      document.getElementById("resetBtn").addEventListener("click", function () {
        count = 0;
        render();
      });
      /*
         ★ 핵심 사고방식
            "데이터(count)를 바꾼다"  →  "화면을 다시 그린다(render)"
            이 두 단계로 나누는 게 모든 프론트엔드의 기본 구조다.
            React 도 결국 이 구조를 자동화한 것뿐이다.
      */

      // ---------- 4. input 이벤트 — 타이핑할 때마다 ----------
      const liveInput = document.getElementById("liveInput");
      const liveOut = document.getElementById("liveOut");

      liveInput.addEventListener("input", function () {
        liveOut.textContent = liveInput.value;
      });
      /*
         자주 쓰는 이벤트:
            click     클릭
            input     입력칸 값이 바뀔 때마다 (글자 하나하나)
            change    입력이 끝나고 포커스가 빠질 때
            submit    폼 제출
            keydown   키를 누를 때
      */

      // ---------- 5. 요소 만들어서 붙이기 ----------
      const todoInput = document.getElementById("todoInput");
      const todoBtn = document.getElementById("todoBtn");
      const todoList = document.getElementById("todoList");

      todoBtn.addEventListener("click", function () {
        const text = todoInput.value.trim(); // trim() = 앞뒤 공백 제거

        // 빈 값이면 아무것도 안 함 (가드 절)
        if (text === "") {
          return; // 함수를 여기서 끝냄
        }

        const li = document.createElement("li"); // ① 요소를 만든다
        li.textContent = text; // ② 내용을 채운다
        todoList.appendChild(li); // ③ 부모에 붙인다 ← 이때 화면에 나타남

        todoInput.value = ""; // 입력칸 비우기
        todoInput.focus(); // 커서 다시 입력칸으로 (작지만 중요한 배려)
      });
      /*
         createElement → 내용 채우기 → appendChild
         이 3단계가 "화면에 뭔가 새로 만들어 넣기"의 기본 패턴이다.

         ★ if 문
            if (조건) { 조건이 참일 때 실행 }
            ===  값과 타입이 모두 같은지 (이걸 써라)
            ==   타입을 멋대로 바꿔서 비교 (쓰지 마라. "1" == 1 이 true 다)
      */

      // ---------- 6. 클래스 토글 ----------
      const toggleBtn = document.getElementById("toggleBtn");
      const toggleOut = document.getElementById("toggleOut");

      toggleBtn.addEventListener("click", function () {
        toggleOut.classList.toggle("highlight");
      });
      /*
         classList.add("이름")     클래스 추가
         classList.remove("이름")  제거
         classList.toggle("이름")  있으면 빼고 없으면 넣기
         classList.contains("이름") 있는지 확인 (true/false)

         ★ 아주 중요한 원칙
            스타일을 JS에서 직접 건드리지 마라.
              나쁨:  el.style.backgroundColor = "yellow";
              좋음:  el.classList.add("highlight");   ← 색은 CSS가 정함

            JS는 "지금 어떤 상태냐"만 알려주고, 그 상태가 어떻게 생겼는지는
            CSS가 정한다. 이렇게 나눠야 나중에 디자인 바꿀 때 JS를 안 건드린다.
      */
    </script>
  </body>
</html>
